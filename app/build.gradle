plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yxf.clippathlayout.sample'
    compileSdk rootProject.ext.compileSdkVersion
    
    defaultConfig {
        applicationId "com.yxf.clippathlayout.sample"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    //implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    
    // ClipPathLayout library
    implementation project(':clippathlayout')
    //implementation 'com.yxf:clippathlayout:1.0.+'
    
    // LeakCanary
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
    // LeakCanary no longer needs a separate no-op dependency
}
